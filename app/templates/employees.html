<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Employees · Café Desk</title>
  <link rel="icon" href="/static/images/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/main.css" />
  <link rel="stylesheet" href="/static/css/menu.css" />
  <link rel="stylesheet" href="/static/css/responsive.css" />
</head>
<body data-page="employees">
  <main class="content">
    <div class="content-inner">
      <section class="page-head">
        <div>
          <h2>Employees</h2>
          <p class="lede">Your team list with roles, joining dates and salary types.</p>
        </div>
        <span class="badge badge-ok">Live · Phase 11</span>
      </section>

      <section class="card menu-section">
        <header class="card-head">
          <h3>All employees</h3>
          <button type="button" class="btn btn-primary btn-sm" id="addEmployeeBtn">+ Add employee</button>
        </header>
        <div class="toolbar">
          <input class="input" id="employeeSearch" type="search" placeholder="Search name, mobile, email or role…" autocomplete="off" />
          <select class="input" id="roleFilter" aria-label="Filter by role">
            <option value="">All roles</option>
            <option>Manager</option>
            <option>Cashier</option>
            <option>Chef</option>
            <option>Waiter</option>
            <option>Helper</option>
            <option>Cleaner</option>
          </select>
          <label class="check toolbar-check">
            <input type="checkbox" id="includeInactiveEmployees" checked />
            Show inactive
          </label>
        </div>
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>Employee</th>
                <th>Mobile</th>
                <th>Role</th>
                <th>Joined</th>
                <th>Salary type</th>
                <th class="num">Base salary</th>
                <th>Status</th>
                <th class="col-actions">Actions</th>
              </tr>
            </thead>
            <tbody id="employeeTableBody"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>

  <!-- ===================== Employee modal ===================== -->
  <div class="modal-overlay" id="employeeModal" hidden>
    <div class="modal-box modal-lg" role="dialog" aria-modal="true" aria-labelledby="employeeModalTitle">
      <h4 id="employeeModalTitle">New employee</h4>
      <form id="employeeForm" novalidate>
        <div class="form-grid modal-form-grid">
          <div class="field span-2">
            <label for="employeeName">Full name <span class="req">*</span></label>
            <input class="input" id="employeeName" name="name" type="text" maxlength="100"
                   placeholder="e.g. Priya Sharma" data-validate="required|maxLength:100" />
          </div>
          <div class="field">
            <label for="employeeMobile">Mobile number <span class="req">*</span></label>
            <input class="input" id="employeeMobile" name="mobile" type="tel" maxlength="10" inputmode="numeric"
                   placeholder="e.g. 9876543210" data-validate="required|pattern:phone" />
            <span class="hint">10-digit Indian mobile number</span>
          </div>
          <div class="field">
            <label for="employeeEmail">Email</label>
            <input class="input" id="employeeEmail" name="email" type="email" maxlength="100"
                   placeholder="e.g. priya@cafe.in" data-validate="maxLength:100|pattern:email" />
          </div>
          <div class="field">
            <label for="employeeRole">Role <span class="req">*</span></label>
            <select class="input" id="employeeRole" name="role" data-validate="required">
              <option value="">Select role…</option>
              <option>Manager</option>
              <option>Cashier</option>
              <option>Chef</option>
              <option>Waiter</option>
              <option>Helper</option>
              <option>Cleaner</option>
            </select>
          </div>
          <div class="field">
            <label for="employeeJoiningDate">Joining date <span class="req">*</span></label>
            <input class="input" id="employeeJoiningDate" name="joining_date" type="date"
                   data-validate="required" />
            <span class="hint">Cannot be in the future</span>
          </div>
          <div class="field">
            <label for="employeeSalaryType">Salary type <span class="req">*</span></label>
            <select class="input" id="employeeSalaryType" name="salary_type" data-validate="required">
              <option value="">Select type…</option>
              <option>Monthly</option>
              <option>Daily</option>
              <option>Hourly</option>
            </select>
          </div>
          <div class="field">
            <label for="employeeBaseSalary">Base salary <span class="req">*</span></label>
            <input class="input" id="employeeBaseSalary" name="base_salary" type="number" step="0.01" min="0"
                   placeholder="e.g. 25000" data-validate="required|nonNegative|maxValue:99999999" />
            <span class="hint" id="baseSalaryHint">Amount as per salary type</span>
          </div>
          <div class="field span-2">
            <label for="employeeAddress">Address</label>
            <textarea class="input" id="employeeAddress" name="address" maxlength="255"
                      placeholder="Home address" data-validate="maxLength:255"></textarea>
          </div>
          <div class="field span-2">
            <label class="check">
              <input type="checkbox" id="employeeActive" name="is_active" checked />
              Active
            </label>
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" data-close-modal>Cancel</button>
          <button type="submit" class="btn btn-primary" id="employeeSaveBtn">
            <span class="spinner" aria-hidden="true"></span>
            <span class="btn-label">Save employee</span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/common.js"></script>
  <script src="/static/js/validation.js"></script>
  <script src="/static/js/employees.js"></script>
</body>
</html>
