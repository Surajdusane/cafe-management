<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expenses · Cafe Desk</title>
  <link rel="icon" href="/static/images/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/main.css" />
  <link rel="stylesheet" href="/static/css/menu.css" />
  <link rel="stylesheet" href="/static/css/expenses.css" />
  <link rel="stylesheet" href="/static/css/responsive.css" />
</head>
<body data-page="expenses">
  <main class="content">
    <div class="content-inner">
      <section class="page-head">
        <div>
          <h2>Expenses</h2>
          <p class="lede">Electricity, rent, maintenance and other running costs.</p>
        </div>
        <span class="badge badge-ok">Live · Phase 13</span>
      </section>

      <section class="stat-grid" id="expenseStats" style="grid-template-columns: repeat(3, minmax(0,1fr))">
        <div class="stat-card"><dt>Expenses</dt><dd id="statCount">–</dd></div>
        <div class="stat-card"><dt>Total spent</dt><dd id="statTotal">–</dd></div>
        <div class="stat-card"><dt>Categories used</dt><dd id="statCategories">–</dd></div>
      </section>

      <section class="card menu-section">
        <header class="card-head">
          <h3>Expense history</h3>
          <button type="button" class="btn btn-primary btn-sm" id="addExpenseBtn">+ New expense</button>
        </header>
        <div class="toolbar">
          <input class="input search-input" id="searchInput" type="search" placeholder="Search title or notes…" aria-label="Search expenses" />
          <select class="input" id="categoryFilter" aria-label="Filter by category">
            <option value="">All categories</option>
          </select>
          <select class="input" id="methodFilter" aria-label="Filter by payment method">
            <option value="">All methods</option>
          </select>
          <input class="input" id="startDateFilter" type="date" aria-label="From date" />
          <input class="input" id="endDateFilter" type="date" aria-label="To date" />
          <button type="button" class="btn btn-ghost btn-sm" id="clearFiltersBtn">Clear filters</button>
        </div>
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>Title</th>
                <th>Category</th>
                <th class="num">Amount</th>
                <th>Paid on</th>
                <th>Method</th>
                <th>Notes</th>
                <th class="col-actions">Actions</th>
              </tr>
            </thead>
            <tbody id="expenseTableBody"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>

  <!-- ===================== Expense modal ===================== -->
  <div class="modal-overlay" id="expenseModal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="expenseModalTitle">
      <h4 id="expenseModalTitle">New expense</h4>
      <form id="expenseForm" novalidate>
        <div class="form-grid">
          <div class="field span-2">
            <label for="expenseTitle">Title <span class="req">*</span></label>
            <input class="input" id="expenseTitle" name="title" type="text" maxlength="120"
                   data-validate="required|maxLength:120" placeholder="e.g. March electricity bill" />
          </div>
          <div class="field">
            <label for="expenseCategory">Category <span class="req">*</span></label>
            <select class="input" id="expenseCategory" name="category" data-validate="required">
              <option value="">Select category…</option>
            </select>
          </div>
          <div class="field">
            <label for="expenseAmount">Amount <span class="req">*</span></label>
            <input class="input" id="expenseAmount" name="amount" type="number" step="0.01"
                   data-validate="positiveNumber|maxValue:99999999" placeholder="0.00" />
          </div>
          <div class="field">
            <label for="expenseDate">Date <span class="req">*</span></label>
            <input class="input" id="expenseDate" name="expense_date" type="date" data-validate="required" />
            <span class="hint">Defaults to today</span>
          </div>
          <div class="field">
            <label for="expenseMethod">Payment method</label>
            <select class="input" id="expenseMethod" name="payment_method">
              <option>Cash</option>
              <option>UPI</option>
              <option>Card</option>
              <option>Other</option>
            </select>
          </div>
          <div class="field span-2">
            <label for="expenseNotes">Notes</label>
            <textarea class="input" id="expenseNotes" name="notes" maxlength="255"
                      placeholder="e.g. bill no. 8841" data-validate="maxLength:255"></textarea>
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" data-close-modal>Cancel</button>
          <button type="submit" class="btn btn-primary" id="expenseSaveBtn">
            <span class="spinner" aria-hidden="true"></span>
            <span class="btn-label">Save expense</span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/common.js"></script>
  <script src="/static/js/validation.js"></script>
  <script src="/static/js/expenses.js"></script>
</body>
</html>
